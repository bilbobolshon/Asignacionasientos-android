name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk asignacionasientos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: asignacionasientos-apk
          path: asignacionasientos.apk

      # deja el APK en la rama "apk" para poder descargarlo facilmente
      - name: Publicar en la rama apk
        run: |
          mkdir salida && cp asignacionasientos.apk salida/
          cd salida
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add asignacionasientos.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
